services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barzinho
      POSTGRES_USER: barzinho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD antes de iniciar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - barzinho_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barzinho -d barzinho"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  barzinho_pg:
